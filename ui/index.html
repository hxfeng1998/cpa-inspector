<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPA Inspector</title>
<style>
:root { /* white：与 CPA 管理面板的 white 主题一致。嵌入面板时这些表面/文字色会被面板实际生效的变量覆盖 */
  color-scheme: light;
  --page: #ffffff; --surface: #ffffff; --raised: #ffffff; --sunken: #f6f6f6;
  --ink: #2d2a26; --ink-2: #6d6760; --muted: #a29c95;
  --hair: #e5e5e5; --axis: #d9d9d9; --ring: rgba(45,42,38,.12);
  --series-1: #2a78d6; --series-2: #eb6834; --accent: #2a78d6; --accent-wash: rgba(42,120,214,.10);
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-text: #006300;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --j-key: #184f95; --j-str: #006300; --j-num: #a3420f; --j-lit: #4a3aa7;
}
:root[data-theme="light"] { /* 面板默认的暖米色外观 */
  --page: #f0eee8; --surface: #faf9f5; --raised: #faf9f5; --sunken: #e9e6df;
  --hair: #e3e1db; --axis: #d5d2cb;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #1d1b18; --surface: #151412; --raised: #262320; --sunken: #262320;
  --ink: #f6f4f1; --ink-2: #c9c3bb; --muted: #9c958d;
  --hair: #3a3530; --axis: #4a453f; --ring: rgba(255,255,255,.12);
  --series-1: #3987e5; --series-2: #d95926; --accent: #3987e5; --accent-wash: rgba(57,135,229,.18);
  --good-text: #0ca30c;
  --j-key: #86b6ef; --j-str: #6fc98f; --j-num: #eda57c; --j-lit: #b3abf2;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 20px; } h3 { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); } .sub { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 208px minmax(0,1fr); min-height: 100%; }
.nav { position: sticky; top: 0; height: 100vh; padding: 20px 12px; border-right: 1px solid var(--hair); display: flex; flex-direction: column; gap: 2px; }
.brand { padding: 4px 10px 18px; }
.brand b { display: block; font-size: 15px; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--muted); }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); }
.nav button:hover { background: var(--sunken); }
.nav button[aria-current="page"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.nav button:focus-visible, .btn:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav .count { margin-left: auto; font-size: 11.5px; padding: 0 7px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); }
.nav .count.hot { background: var(--critical); color: #fff; }
.nav .foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--muted); display: grid; gap: 8px; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.live.off i { background: var(--muted); }
main { padding: 28px 32px 64px; min-width: 0; }
.head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.head p { margin: 0; color: var(--ink-2); }
.head .sp { flex: 1; }

.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; }
.card > header { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
.card > .body { padding: 14px 18px 18px; }
.grid { display: grid; gap: 16px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 16px; }
.tile { padding: 16px 18px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; }
.tile.hero .value { font-size: 48px; }
.tile .note { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.two { grid-template-columns: minmax(0,3fr) minmax(0,2fr); align-items: start; }
@media (max-width: 1100px) { .two { grid-template-columns: minmax(0,1fr); } }

.btn { border: 1px solid var(--hair); background: var(--raised); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--axis); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); padding: 4px 8px; }
.btn.ghost:hover { background: var(--sunken); }
.btn.danger { color: var(--critical); }
.btn.sm { padding: 2px 9px; font-size: 12.5px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filters input, .filters select, .field { border: 1px solid var(--hair); background: var(--raised); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.filters input[type=search] { flex: 1 1 240px; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; background: var(--raised); }
.seg button { all: unset; cursor: pointer; padding: 5px 12px; color: var(--ink-2); font-size: 13px; }
.seg button[aria-pressed=true] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.seg button:disabled { cursor: wait; opacity: .6; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--hair); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
td { padding: 9px 12px; border-bottom: 1px solid var(--hair); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--sunken); }
td.r, th.r { text-align: right; }
.tablewrap { overflow: auto; border-radius: 12px; }
.tablewrap.viewport { max-height: calc(100vh - 210px); min-height: 240px; overscroll-behavior: contain; scrollbar-gutter: stable; }
.tablewrap.pinfirst th:first-child, .tablewrap.pinfirst td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: min(300px, 40vw); max-width: min(460px, 46vw); box-shadow: 1px 0 0 var(--hair); }
.tablewrap.pinfirst th:first-child { z-index: 3; }
.tablewrap.pinfirst th { z-index: 2; }
.tablewrap.pinfirst td:first-child .path { overflow-wrap: anywhere; }
.tablewrap::-webkit-scrollbar { height: 12px; width: 12px; }
.tablewrap::-webkit-scrollbar-thumb { background: var(--axis); border-radius: 6px; border: 3px solid var(--surface); }
.tablewrap::-webkit-scrollbar-thumb:hover { background: var(--muted); }
.clip { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arrow { color: var(--muted); padding: 0 4px; }

.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 1px 8px 1px 6px; border-radius: 99px; border: 1px solid var(--ring); white-space: nowrap; color: var(--ink); }
.sev svg { width: 11px; height: 11px; flex: none; }
.sev.critical svg { color: var(--critical); } .sev.warn svg { color: var(--warning); }
.sev.notice svg { color: var(--accent); } .sev.info svg { color: var(--muted); } .sev.ok svg { color: var(--good); }
.sev.critical { background: color-mix(in srgb, var(--critical) 12%, transparent); }
.sev.warn { background: color-mix(in srgb, var(--warning) 16%, transparent); }
.tag { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 5px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.tag.new { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.finding { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); align-items: start; }
.finding:last-child { border-bottom: 0; }
.finding .t { font-weight: 600; }
.finding .d { color: var(--ink-2); font-size: 13px; grid-column: 2; }
.finding .e { grid-column: 2; background: var(--sunken); border-radius: 6px; padding: 5px 9px; overflow-wrap: anywhere; white-space: pre-wrap; }
.finding .m { grid-column: 2; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.finding.acked { opacity: .55; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

/* chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); margin-left: auto; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,.14); min-width: 130px; z-index: 5; }
.tip .k { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); }
.tip .k b { color: var(--ink); } .tip .k i { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: middle; }
.meter { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--series-1) 18%, transparent); vertical-align: middle; margin-right: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.36); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(1080px, 96vw); background: var(--page); z-index: 21; overflow: auto; border-left: 1px solid var(--hair); box-shadow: -12px 0 48px rgba(0,0,0,.18); }
.drawer .top { position: sticky; top: 0; z-index: 3; background: var(--page); padding: 18px 28px 0; border-bottom: 1px solid var(--hair); }
.drawer .content { padding: 20px 28px 60px; }
.tabs { display: flex; gap: 2px; margin-top: 14px; overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--ink); font-weight: 600; border-color: var(--accent); }
.flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.flow .node { border: 1px solid var(--hair); background: var(--surface); border-radius: 8px; padding: 5px 10px; }
.flow .node small { display: block; color: var(--muted); font-size: 11px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; }
.startline { background: var(--sunken); border-radius: 8px; padding: 8px 12px; overflow-wrap: anywhere; }
table.hdr th { position: static; background: none; color: var(--ink-2); font-size: 12.5px; font-weight: 600; width: 1%; padding: 6px 16px 6px 0; vertical-align: top; border-bottom: 1px solid var(--hair); }
table.hdr td { padding: 6px 0; overflow-wrap: anywhere; border-bottom: 1px solid var(--hair); }
table.hdr tr:last-child th, table.hdr tr:last-child td { border-bottom: 0; }
.rawbox { background: var(--sunken); border-radius: 8px; padding: 12px; max-height: 70vh; overflow: auto; }
.card > header { flex-wrap: wrap; }
.kv div small { display: block; color: var(--muted); font-size: 12px; }

/* conversation */
.msg { border: 1px solid var(--hair); border-radius: 10px; background: var(--surface); margin-bottom: 10px; overflow: hidden; }
.msg > .who { display: flex; gap: 8px; align-items: center; padding: 7px 12px; font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--hair); background: var(--sunken); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.msg.assistant > .who { background: var(--accent-wash); }
.blk { padding: 10px 12px; border-bottom: 1px solid var(--hair); }
.blk:last-child { border-bottom: 0; }
.blk .bt { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 8px; align-items: center; }
.blk pre, pre.raw { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.55 var(--sans); }
.blk.thinking pre { color: var(--ink-2); font-style: italic; }
.blk.tool pre, pre.raw { font: 12.5px/1.5 var(--mono); }
.blk.tool { background: var(--sunken); }

/* json tree */
.jt { font: 12.5px/1.6 var(--mono); overflow-wrap: anywhere; }
.jt .n { padding-left: 16px; }
.jt .tog { cursor: pointer; user-select: none; color: var(--muted); display: inline-block; width: 14px; margin-left: -14px; text-align: center; }
.jt .k { color: var(--j-key); } .jt .s { color: var(--j-str); white-space: pre-wrap; } .jt .d { color: var(--j-num); } .jt .l { color: var(--j-lit); }
.jt .c { color: var(--muted); }
.jt .flag { background: var(--accent-wash); border-radius: 4px; outline: 1px solid var(--accent); }
.jt .more { color: var(--accent); cursor: pointer; }
.ev { border-bottom: 1px solid var(--hair); padding: 6px 0; display: grid; grid-template-columns: 64px 220px minmax(0,1fr); gap: 10px; align-items: start; }
.ev .t { color: var(--muted); text-align: right; }

/* schema */
.atlas { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .atlas { grid-template-columns: minmax(0,1fr); } }
.scopes { max-height: calc(100vh - 140px); overflow: auto; padding: 8px; position: sticky; top: 16px; }
.scopes h3 { padding: 10px 8px 4px; }
.scopes button { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; width: calc(100% - 16px); }
.scopes button:hover { background: var(--sunken); }
.scopes button[aria-current=true] { background: var(--accent-wash); font-weight: 600; }
.scopes .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.path .dim { color: var(--muted); }

.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.gate form { width: min(420px, 100%); padding: 28px; display: grid; gap: 14px; }
.gate input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--hair); background: var(--raised); width: 100%; }
.err { color: var(--critical); font-size: 13px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 8px 16px; border-radius: 99px; z-index: 50; font-size: 13px; }

/* 嵌入 CPA 管理面板（iframe）时：面板已有侧边栏，这里改为顶部横向标签；并为面板右上角的浮动图标留位 */
html.embedded .app { grid-template-columns: minmax(0,1fr); }
html.embedded .nav { position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; align-items: center; gap: 4px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--hair); padding: 8px 220px 8px 20px; background: var(--page); min-height: 52px; }
html.embedded .brand { display: none; }
html.embedded .nav button { padding: 6px 12px; white-space: nowrap; }
html.embedded .nav .count { margin-left: 6px; }
html.embedded .nav .foot { margin: 0 0 0 auto; padding: 0 0 0 12px; display: flex; white-space: nowrap; }
html.embedded main { padding: 20px 24px 48px; }
html.embedded .scopes { top: 68px; max-height: calc(100vh - 100px); }
html.embedded .tablewrap.viewport { max-height: calc(100vh - 262px); }
html.embedded .drawer .top > div:first-child { padding-right: 210px; }
@media (max-width: 820px) {
  html.embedded .nav { padding-right: 16px; padding-top: 52px; }
  html.embedded .nav .foot { display: none; }
  .tablewrap.viewport { max-height: 70vh; }
  .app { grid-template-columns: minmax(0,1fr); }
  .nav { position: static; height: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--hair); padding: 8px 12px; }
  .brand, .nav .foot { display: none; }
  main { padding: 18px 16px 48px; }
  .drawer .top, .drawer .content { padding-left: 16px; padding-right: 16px; }
  .ev { grid-template-columns: 48px minmax(0,1fr); } .ev .body { grid-column: 1 / -1; }
}
</style>

/* 主题完全跟随 CPA 管理面板，本页不提供自己的开关。
   - 嵌在面板里（同源 iframe）：读面板 <html data-theme> 以及它实际生效的 CSS 变量，颜色逐值一致；MutationObserver 实时跟随切换。
   - 独立标签页打开：读面板持久化的 localStorage["cli-proxy-theme"]（auto / white / dark / 其它=默认暖色），storage 事件跟随。

</script>
</head>

  return h("div", {}, head("字段图谱", "每个作用域下观测到的全部字段；按模型对比出现率，一眼看出哪个模型多了或少了字段。"), h("div", { class: "atlas" }, side, panel));
}

/* ---------- 设置 ---------- */
function viewSettings() {
  const o = state.overview, c = o.config, st = o.stats;
  const act = (label, body, path, cls) => h("button", { class: "btn " + (cls || ""), onclick: async () => { if (!confirm(label + "？此操作不可撤销。")) return; await api(path, body); toast("已完成"); refresh(false); } }, label);
  return h("div", {}, head("设置", "配置项在 CLIProxyAPI 的 config.yaml → plugins.configs.cpa-inspector 下修改，保存后热生效。"),
    h("div", { class: "grid two" },
      h("section", { class: "card" }, h("header", {}, h("h3", {}, "当前配置")), h("div", { class: "body" }, h("div", { class: "kv" }, Object.entries(c).map(([k, v]) => kv(k, String(v), true))))),
      h("section", { class: "card" }, h("header", {}, h("h3", {}, "运行状态")), h("div", { class: "body" }, h("div", { class: "kv" }, kv("启动时间", clock(o.started_at)), kv("已处理请求", nf.format(st.requests)), kv("上游分片", nf.format(st.upstream_chunks)), kv("下游分片", nf.format(st.downstream_chunks)), kv("未能关联的上游分片", nf.format(st.orphan_chunks)), kv("存储占用", bytes(o.storage.bytes) + (o.storage.memory_only ? "（数据目录不可写，仅内存）" : "")))))),
    envRewriteCard(c),
    h("section", { class: "card", style: "margin-top:16px" }, h("header", {}, h("h3", {}, "基线与数据")), h("div", { class: "body", style: "display:grid;gap:12px" },
      h("p", { class: "sub", style: "margin:0" }, "「重建基线」表示你已审阅当前所有字段并认定为正常：全部字段并入基线，现有漂移发现标记为已确认，此后只报告新的变化。"),
      h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, act("以当前状态重建基线", {}, "/rebaseline", "primary"), act("清空请求记录", { target: "records" }, "/clear", "danger"), act("清空发现项", { target: "findings" }, "/clear", "danger"), act("清空字段图谱", { target: "schema" }, "/clear", "danger"),
        h("button", { class: "btn", onclick: () => { try { localStorage.removeItem(KEY_STORE); } catch (e) {} state.key = ""; renderGate(""); } }, "退出并清除本机保存的密钥")))));
}

// Codex 时区与日期改写开关：经宿主接口写回 config.yaml，宿主热重载后插件按新配置生效。
function envRewriteCard(c) {
  const zone = c.rewrite_env_timezone || "", on = c.rewrite_env_enabled !== false;
  const status = !zone ? "未配置 rewrite_env_timezone，不改写" : on ? "生效中：改写为 " + zone : "已关闭：请求原样转发";
  const set = async (want) => {
    if (want === on) return;
    seg.querySelectorAll("button").forEach((b) => { b.disabled = true; });
    try {
      await mgmt(PLUGIN_CONFIG_API, "PATCH", { rewrite_env_enabled: want });
      // 宿主异步重载配置：等插件回报的配置变过来再刷新，最多约 5 秒
      let applied = false;
      for (let i = 0; i < 10 && !applied; i++) {
        await new Promise((r) => setTimeout(r, 500));
        applied = (await api("/overview")).config.rewrite_env_enabled === want;
      }
      toast(applied ? (want ? "已开启时区与日期改写" : "已关闭时区与日期改写") : "已保存到 config.yaml，等待宿主重载配置");
    } catch (e) {
      if (e.auth) return renderGate(e.message);
      toast(e.status === 404 || e.status === 405 ? "当前 CLIProxyAPI 不支持在线修改插件配置，请在 config.yaml 中设置 rewrite_env_enabled" : "保存失败：" + e.message);
    }
    refresh(false);
  };
  const seg = h("div", { class: "seg", role: "group", "aria-label": "时区与日期改写" },
    h("button", { "aria-pressed": String(on), onclick: () => set(true) }, "开启"),
    h("button", { "aria-pressed": String(!on), onclick: () => set(false) }, "关闭"));
  return h("section", { class: "card", style: "margin-top:16px" }, h("header", {}, h("h3", {}, "Codex 时区与日期改写")), h("div", { class: "body", style: "display:grid;gap:12px" },
    h("p", { class: "sub", style: "margin:0" }, "开启后把 Codex 请求 <environment_context> 里的时区与日期改写为 rewrite_env_timezone 指定的时区；关闭后请求原样转发，重新开启时沿用已有的历史映射。切换会写回 config.yaml（rewrite_env_enabled）。"),
    h("div", { style: "display:flex;gap:12px;align-items:center;flex-wrap:wrap" }, seg, h("span", { class: "muted" }, status))));
}

/* ---------- 启动 ---------- */
(async function boot() {
  if (!state.key) return renderGate("");
  try { state.overview = await api("/overview"); renderApp(); } catch (e) { renderGate(e.auth ? e.message : "无法连接 Management API：" + e.message); }
})();
</script>
