name: build

# 只构建主分支：其它分支、PR、tag 的推送都不会触发。
# 在功能分支上开发不会产生任何构建；合并进 main 之后才构建并发布。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch: # 手动触发也只对 main 生效（见各 job 的 if）

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: build (linux/${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm # 原生 ARM runner，不走 QEMU
    runs-on: ${{ matrix.runner }}
    # 与 CLIProxyAPI 官方镜像同一基础（debian bookworm, glibc 2.36），保证产物能被官方 Docker 镜像加载。
    container: golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
          go test -race -count=1 ./...

      - name: Build
        run: |
          CGO_ENABLED=1 go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w" -o out/cpa-inspector.so .
          rm -f out/cpa-inspector.h
          cp LICENSE out/
          # 包内文件名必须是 cpa-inspector.so：宿主把文件名当作插件 ID。
          tar -C out -czf cpa-inspector-linux-${{ matrix.arch }}.tar.gz cpa-inspector.so LICENSE
          echo "glibc symbols required:"; objdump -T out/cpa-inspector.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: cpa-inspector-linux-${{ matrix.arch }}
          path: cpa-inspector-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and version
        id: meta
        run: |
          cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS && cd ..
          version=$(grep -oP 'pluginVersion\s*=\s*"\K[^"]+' rpc.go)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 两个产物的名字只差一个字母，发布说明里固定带上"该下哪个"。
          cat > which.md <<'NOTE'
          ### 该下载哪个？

          | 文件 | 适用 |
          |---|---|
          | `cpa-inspector-linux-amd64.tar.gz` | **x86-64（Intel / AMD）—— 绝大多数 VPS 和 PC 选这个** |
          | `cpa-inspector-linux-arm64.tar.gz` | ARM：甲骨文 Ampere、AWS Graviton、树莓派（64 位系统） |

          不确定就在服务器上执行 `uname -m`：输出 `x86_64` 下 **amd64**，输出 `aarch64` 下 **arm64**。
          解压得到 `cpa-inspector.so`（不要改名），放进 CPA 的 `plugins/` 目录后重启。
          NOTE

      # 滚动预发布：始终指向 main 的最新一次构建。
      - name: Publish rolling "latest"
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "main 最新构建 (${GITHUB_SHA::7})" \
            --notes "由 main 分支的提交 ${GITHUB_SHA} 自动构建，源码版本 v${{ steps.meta.outputs.version }}。每次 main 更新都会覆盖本发布；需要固定版本请使用 vX.Y.Z 的正式发布。

          $(cat which.md)"

      # 正式发布：源码里的版本号第一次出现时创建，之后不再改动。发版 = 修改 rpc.go 的 pluginVersion 并合入 main。
      - name: Publish versioned release (once per version)
        run: |
          tag="v${{ steps.meta.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, assets left untouched"
            # 产物不可变；仅当说明里还没有"该下载哪个"时补上。
            body=$(gh release view "$tag" --json body --jq .body)
            if ! grep -q "该下载哪个" <<<"$body"; then
              printf '%s\n\n%s\n' "$body" "$(cat which.md)" > notes.md
              gh release edit "$tag" --notes-file notes.md
            fi
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS --target "$GITHUB_SHA" --title "$tag" --generate-notes --notes "$(cat which.md)"
          fi
